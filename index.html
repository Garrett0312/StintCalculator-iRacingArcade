<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stint Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: rgba(8, 12, 18, 1);
    --border: rgba(255, 165, 0, 0.35);
    --accent: #ff9d00;
    --accent2: #00d4ff;
    --green: #39ff6e;
    --red: #ff4444;
    --yellow: #ffd700;
    --text: #e8e8e8;
    --muted: #7a8a9a;
    --input-bg: rgba(255,255,255,0.06);
    --font-mono: 'Share Tech Mono', monospace;
    --font-ui: 'Rajdhani', sans-serif;
  }

  html, body {
    width: 520px;
    min-height: 0;
    background: transparent;
    font-family: var(--font-ui);
    color: var(--text);
    user-select: none;
    font-size: 11px;
  }

  #app {
    background: linear-gradient(135deg, rgba(18, 22, 28, 1) 0%, rgba(8, 12, 18, 1) 100%);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    transform-origin: top left;
    position: relative;
  }

  /* HEADER */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    height: 22px;
    background: rgba(255,157,0,0.12);
    border-bottom: 1px solid var(--border);
    cursor: move;
  }
  #header-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .hbtn {
    width: 14px; height: 14px; border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    color: var(--muted); font-size: 9px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .hbtn:hover { background: rgba(255,255,255,0.14); color: var(--text); }

  /* BODY */
  #body { padding: 5px 7px 7px; }

  /* INPUTS ROW */
  #inputs-grid-wrap { margin-bottom: 5px; }
  .inputs-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }
  .input-group { display: flex; flex-direction: column; gap: 1px; }
  .input-group label {
    font-size: 7px; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--muted); font-weight: 600; white-space: nowrap;
  }
  .input-wrap {
    display: flex; align-items: stretch;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 3px; overflow: hidden;
    background: var(--input-bg); transition: border-color .2s;
  }
  .input-wrap:focus-within { border-color: var(--accent); }
  .input-wrap input {
    border: none !important; border-radius: 0 !important;
    flex: 1; min-width: 0; background: transparent !important;
    color: var(--accent); font-family: var(--font-mono);
    font-size: 12px; padding: 1px 3px; outline: none;
    -moz-appearance: textfield; appearance: textfield;
  }
  .input-wrap input::-webkit-inner-spin-button,
  .input-wrap input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .steppers { display: flex; flex-direction: row; border-left: 1px solid rgba(255,255,255,0.08); }
  .steppers-col { display: flex; flex-direction: column; }
  .steppers-col + .steppers-col { border-left: 1px solid rgba(255,255,255,0.08); }
  .step-btn {
    flex: 1; width: 13px; padding: 0;
    background: rgba(255,255,255,0.04); border: none;
    color: var(--muted); font-size: 7px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .1s, color .1s; user-select: none;
  }
  .step-btn:hover { background: rgba(255,157,0,0.18); color: var(--accent); }
  .step-btn:active { background: rgba(255,157,0,0.32); }
  .steppers-col .step-btn + .step-btn { border-top: 1px solid rgba(255,255,255,0.08); }
  .steppers-col:first-child .step-btn { color: rgba(122,138,154,0.8); }
  .steppers-col:first-child .step-btn:hover { color: var(--accent); }

  /* DERIVED STATS */
  .stat-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 2px; margin-bottom: 5px; padding: 4px 0;
    border-top: 1px solid rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .stat { text-align: center; }
  .stat-val { font-family: var(--font-mono); font-size: 12px; line-height: 1.1; }
  .stat-lbl { font-size: 5px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); margin-top: 1px; }
  .col-orange { color: var(--accent); }
  .col-blue   { color: var(--accent2); }
  .col-green  { color: var(--green); }
  .col-red    { color: var(--red); }
  .col-yellow { color: var(--yellow); }

  /* ── NEW TIMELINE LAYOUT ── */
  #timeline-container {
    display: flex;
    flex-direction: column;
    margin-top: 4px;
    margin-bottom: 4px;
  }
  
  #timeline-header {
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    height: 14px;
    margin-bottom: 2px;
  }

  #timeline-axis {
    flex: 1;
    position: relative;
    height: 100%;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .axis-lbl {
    position: absolute;
    left: 2px;
    bottom: 2px;
    font-size: 8px;
    color: var(--muted);
    font-weight: 700;
  }

  .axis-tick {
    position: absolute;
    bottom: 2px;
    transform: translateX(-50%);
    font-size: 8px;
    color: var(--text);
  }

  #pit-header {
    width: 44px;
    text-align: center;
    font-size: 8px;
    color: var(--muted);
    font-weight: 700;
    margin-left: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    padding-bottom: 2px;
  }

  #timeline-wrapper {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    height: 38px;
  }

  #stints-body {
    flex: 1;
    display: flex;
    flex-direction: row;
    gap: 1px;
    position: relative;
  }

  #pit-stops-box {
    width: 44px;
    background: rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-left: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  /* --- REPLACEMENT BLOCK (START) --- */
  .stint-seg {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 4px;
    cursor: pointer;
    container-type: inline-size;
    container-name: seg;
    transition: filter .15s;
  }
  .stint-seg:hover { filter: brightness(1.2); }

  /* Generic Column Container */
  .seg-left, .seg-center-group, .seg-right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center; /* Default to center */
    min-width: 0;
    z-index: 2;
    line-height: 1;
    height: 100%;
  }

  /* Specific Alignment */
  .seg-left { align-items: flex-start; }
  .seg-right { align-items: flex-end; }

  /* Typography */
  .seg-val, .seg-main-val { 
    font-family: var(--font-mono); font-weight: 700; line-height: 1; 
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .seg-val { font-size: 11px; }
  .seg-main-val { font-size: 18px; }
  .seg-lbl { 
    font-size: 6px; letter-spacing: .5px; text-transform: uppercase; 
    line-height: 1; white-space: nowrap; overflow: hidden;
  }

  /* Pit Input */
  .pit-input {
    background: transparent; border: none; color: var(--red);
    font-family: var(--font-mono); font-size: 14px; text-align: center;
    outline: none; width: 100%; max-width: 44px;
    padding: 0; margin: 0; display: block;
    line-height: 1;
  }
  .pit-input::-webkit-inner-spin-button, .pit-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

  /* State Classes */
  .stint-seg.locked-seg { background-color: #303030 !important; border: 1px solid #444 !important; color: #fff; }
  .stint-seg.finish-seg { box-shadow: inset -2px 0 0px rgba(255,255,255,0.5); }
  .stint-seg.done-seg { opacity: 0.45; }

  /* Container Queries */
  @container seg (max-width: 70px) { .seg-lbl { display: none; } }
  @container seg (max-width: 70px) { 
    .seg-val, .pit-input { font-size: 9px !important; } 
    .pit-input { max-width: 24px; }
  }
  @container seg (max-width: 45px) { .seg-val { font-size: 7px !important; } .pit-input { max-width: 20px; } }

  /* Color/Dropdown helpers */
  .seg-text-dark { color: #000; }
  .seg-text-light { color: #fff; }
  .type-extra-short { background: #1e90ff; }
  .type-short { background: #e53935; }
  .type-normal { background: #fdd835; }
  .type-long { background: #f5f5f5; }
  .type-extra-long { background: #43a047; }
  .seg-dropdown { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background: rgba(8,12,18,0.92); z-index: 10; backdrop-filter: blur(2px); }
  .seg-dropdown.open { display: flex; }
  .seg-dropdown select { background: rgba(255,255,255,0.08); border: 1px solid var(--accent); border-radius: 3px; color: var(--accent); font-family: var(--font-ui); font-size: 10px; font-weight: 700; cursor: pointer; outline: none; padding: 1px 4px; width: 85%; text-align: center; }
  .seg-dropdown select option { background: #111; }
  .seg-dropdown-btns { display: flex; gap: 2px; width: 85%; }
  .seg-dd-btn { flex: 1; background: transparent; border: 1px solid rgba(255,255,255,0.15); border-radius: 2px; color: var(--muted); font-size: 8px; font-family: var(--font-ui); font-weight: 700; cursor: pointer; padding: 1px 0; text-align: center; transition: all .15s; }
  .seg-dd-btn:hover { border-color: var(--accent); color: var(--accent); }
  .seg-dd-btn.locked { border-color: var(--red); color: var(--red); }
  .seg-dd-btn.close-btn:hover { border-color: var(--muted); color: var(--text); }

  /* TOTALS */
  .totals-row {
    display: flex; justify-content: space-between; align-items: center;
    gap: 2px; padding: 3px 5px 2px;
    border-top: 1px solid rgba(255,255,255,0.1); margin-top: 3px;
  }
  .totals-row .tl { font-size: 7px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); font-weight: 700; }
  .totals-row .tv { font-family: var(--font-mono); font-size: 8px; color: var(--accent2); }

  /* FUEL WARNING */
  #fuel-warn {
    margin-top: 4px; padding: 3px 5px; border-radius: 3px;
    font-size: 8px; font-weight: 700; text-align: center;
    letter-spacing: .5px; display: none;
  }
  #fuel-warn.bad { background: rgba(255,68,68,.18); border: 1px solid var(--red); color: var(--red); display:block; }
  #fuel-warn.ok  { background: rgba(57,255,110,.1); border: 1px solid var(--green); color: var(--green); display:block; }

  #resize-handle {
    position: absolute; bottom: 0; right: 0;
    width: 14px; height: 14px; cursor: nwse-resize;
    display: flex; align-items: flex-end; justify-content: flex-end;
    padding: 2px; opacity: 0.35; transition: opacity .15s;
  }
  #resize-handle:hover { opacity: 0.9; }
  #resize-handle svg { display: block; }

  /* ── FINISH LINE ── */
  .finish-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 12px;
    z-index: 0; /* Sits behind text/inputs */
    pointer-events: none;
    transform: translateX(-50%);
    /* SVG Data URI for crisp scaling */
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='200' viewBox='0 0 12 12' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='6' height='6' fill='black'/%3E%3Crect x='6' y='6' width='6' height='6' fill='black'/%3E%3Crect x='6' width='6' height='6' fill='white'/%3E%3Crect y='6' width='6' height='6' fill='white'/%3E%3C/svg%3E");
    background-size: 12px 12px;
    opacity: 0.6; /* Slight transparency */
    /*border: 1px solid var(--black);*/
    /*border-left: 1px solid rgba(255,255,255,0.1);
    border-right: 1px solid rgba(255,255,255,0.1);*/
  }

</style>
</head>
<body>

<div id="app">
  <div id="header">
    <span id="header-title">⬡ STINT CALC</span>
    <button class="hbtn" id="inputs-btn" title="Toggle Inputs">▾</button>
  </div>

  <div id="body">
    <div id="inputs-section">
      <div id="inputs-grid-wrap">
        <div class="inputs-grid">
          <div class="input-group">
            <label>Race Laps</label>
            <div class="input-wrap">
              <input type="number" id="inp-laps" min="1" max="99" style="font-size:14px;">
              <div class="steppers">
                <div class="steppers-col">
                  <button class="step-btn" tabindex="-1" data-target="inp-laps" data-dir="10">▲</button>
                  <button class="step-btn" tabindex="-1" data-target="inp-laps" data-dir="-10">▼</button>
                </div>
                <div class="steppers-col">
                  <button class="step-btn" tabindex="-1" data-target="inp-laps" data-dir="1">▲</button>
                  <button class="step-btn" tabindex="-1" data-target="inp-laps" data-dir="-1">▼</button>
                </div>
              </div>
            </div>
          </div>
          <div class="input-group">
            <label>Cur Lap</label>
            <div class="input-wrap">
              <input type="number" id="inp-cur" min="1" max="99" style="font-size:14px;">
              <div class="steppers">
                <div class="steppers-col">
                  <button class="step-btn" tabindex="-1" data-target="inp-cur" data-dir="10">▲</button>
                  <button class="step-btn" tabindex="-1" data-target="inp-cur" data-dir="-10">▼</button>
                </div>
                <div class="steppers-col">
                  <button class="step-btn" tabindex="-1" data-target="inp-cur" data-dir="1">▲</button>
                  <button class="step-btn" tabindex="-1" data-target="inp-cur" data-dir="-1">▼</button>
                </div>
              </div>
            </div>
          </div>
          <div class="input-group">
            <label>Fuel Left</label>
            <div class="input-wrap">
              <input type="number" id="inp-fuel" min="0" max="100" step="1" style="font-size:14px;">
              <div class="steppers">
                <div class="steppers-col">
                  <button class="step-btn" tabindex="-1" data-target="inp-fuel" data-dir="10">▲</button>
                  <button class="step-btn" tabindex="-1" data-target="inp-fuel" data-dir="-10">▼</button>
                </div>
                <div class="steppers-col">
                  <button class="step-btn" tabindex="-1" data-target="inp-fuel" data-dir="1">▲</button>
                  <button class="step-btn" tabindex="-1" data-target="inp-fuel" data-dir="-1">▼</button>
                </div>
              </div>
            </div>
          </div>
          <div class="input-group">
            <label>Laps/Tank</label>
            <div class="input-wrap">
              <input type="number" id="inp-estlaps" min="0.1" max="999" step="0.1" style="font-size:14px;">
              <div class="steppers">
                <div class="steppers-col">
                  <button class="step-btn" tabindex="-1" data-target="inp-estlaps" data-dir="1">▲</button>
                  <button class="step-btn" tabindex="-1" data-target="inp-estlaps" data-dir="-1">▼</button>
                </div>
                <div class="steppers-col">
                  <button class="step-btn" tabindex="-1" data-target="inp-estlaps" data-dir="0.1">▲</button>
                  <button class="step-btn" tabindex="-1" data-target="inp-estlaps" data-dir="-0.1">▼</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="stat-val col-orange" id="s-fpl">—</div><div class="stat-lbl">Fuel/Lap</div></div>
      <div class="stat"><div class="stat-val col-blue"   id="s-maxlaps">—</div><div class="stat-lbl">Laps/Tank</div></div>
      <div class="stat"><div class="stat-val col-green"  id="s-lapsrem">—</div><div class="stat-lbl">Laps Left</div></div>
      <div class="stat"><div class="stat-val col-yellow" id="s-fuelneeded">—</div><div class="stat-lbl">Total Fuel</div></div>
    </div>

    <div id="timeline-container">
      <div id="timeline-header">
        <div id="timeline-axis"></div>
        <div id="pit-header">Pit Stops</div>
      </div>
      <div id="timeline-wrapper">
        <div id="stints-body"></div>
        <div id="pit-stops-box">
          <span id="pit-stops-count">0</span>
        </div>
      </div>
    </div>

    <div class="totals-row">
      <span class="tl">Totals</span>
      <span class="tv" id="t-left" style="white-space:nowrap;font-size:8px">—</span>
      <button class="hbtn" onclick="toggleStats()" style="display:inline-flex; margin-left: 6px;">▼</button>
    </div>

    <div id="fuel-warn"></div>
  </div>

  <div id="resize-handle" title="Drag to resize">
    <svg width="8" height="8" viewBox="0 0 8 8" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="1" y1="7" x2="7" y2="1" stroke="#ff9d00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="4" y1="7" x2="7" y2="4" stroke="#ff9d00" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
  </div>
</div>

<script>
  const TANK = 100;
  const OFFSETS = {
    'Extra Short': -4,
    'Short':       -3,
    'Normal':      -2,
    'Long':        -1,
    'Extra Long':   0,
  };
  let MAX_STINTS = 5;
  let MAX_STINTS_LIMIT = 10;

  const state = {
    totalLaps: null, curLap: null, fuelLeft: null, estLaps: null,
    stintTypes:    ['Normal','Normal','Normal','Normal','Normal','Normal','Normal','Normal','Normal','Normal'],
    lockedPitLaps: [null,null,null,null,null,null,null,null,null,null],
  };

  const $ = id => document.getElementById(id);
  const sv = (id, v) => $(id).textContent = v;

  function closeAllDropdowns() {
    document.querySelectorAll('.seg-dropdown.open').forEach(d => d.classList.remove('open'));
  }

  function buildStrategy(lapsNeeded, maxLaps, availableSlots) {
    for (let stintCount = 1; stintCount <= availableSlots; stintCount++) {
      if (stintCount * maxLaps < lapsNeeded) continue;
      const attempt = new Array(stintCount).fill('Extra Long');
      for (let i = stintCount - 1; i >= 0; i--) {
        for (const t of Object.keys(OFFSETS)) {
          const testAttempt = [...attempt];
          testAttempt[i] = t;
          const total = testAttempt.reduce((s, x) => s + maxLaps + OFFSETS[x], 0);
          if (total >= lapsNeeded) { attempt[i] = t; break; }
        }
      }
      const total = attempt.reduce((s, t) => s + maxLaps + OFFSETS[t], 0);
      if (total >= lapsNeeded) return attempt;
    }
    return null;
  }

  function getLockedState() {
    let lockedLaps = 0, firstUnlocked = 0;
    for (let i = 0; i < MAX_STINTS_LIMIT; i++) {
      if (state.lockedPitLaps[i] !== null) { lockedLaps = state.lockedPitLaps[i]; firstUnlocked = i + 1; }
    }
    const lapsNeeded = firstUnlocked > 0 ? state.totalLaps - lockedLaps : state.totalLaps;
    return { lockedLaps, firstUnlocked, lapsNeeded, availableSlots: MAX_STINTS_LIMIT - firstUnlocked };
  }

  function autoStrategy() {
    const { totalLaps, curLap, fuelLeft, estLaps } = state;
    if (!totalLaps || !curLap || !fuelLeft || !estLaps) return;
    const fuelPerLap = fuelLeft / estLaps;
    const maxLaps = Math.max(1, Math.floor(TANK / fuelPerLap));
    const { firstUnlocked, lapsNeeded, availableSlots } = getLockedState();
    const attempt = buildStrategy(lapsNeeded, maxLaps, availableSlots) || new Array(availableSlots).fill('Extra Long');
    const result = new Array(firstUnlocked).fill(null);
    attempt.forEach(t => result.push(t));
    while (result.length < MAX_STINTS_LIMIT) result.push('Normal');
    result.forEach((t, i) => { if (t !== null) state.stintTypes[i] = t; });
    calc();
  }

  function findFewerStopsStrategy() {
    const { totalLaps, curLap, fuelLeft, estLaps } = state;
    if (!totalLaps || !curLap || !fuelLeft || !estLaps) return null;
    const fuelPerLap = fuelLeft / estLaps;
    const maxLaps = Math.max(1, Math.floor(TANK / fuelPerLap));
    const { firstUnlocked, lapsNeeded } = getLockedState();
    let currentCount = 0, lapsAcc = 0;
    for (let i = firstUnlocked; i < MAX_STINTS_LIMIT; i++) {
      lapsAcc += maxLaps + OFFSETS[state.stintTypes[i]]; currentCount++;
      if (lapsAcc >= lapsNeeded) break;
    }
    if (currentCount <= 1) return null;
    const attempt = buildStrategy(lapsNeeded, maxLaps, currentCount - 1);
    return attempt && attempt.reduce((s, t) => s + maxLaps + OFFSETS[t], 0) >= lapsNeeded ? attempt : null;
  }

  function findShorterStrategy() {
    const { totalLaps, curLap, fuelLeft, estLaps } = state;
    if (!totalLaps || !curLap || !fuelLeft || !estLaps) return null;
    const fuelPerLap = fuelLeft / estLaps;
    const maxLaps = Math.max(1, Math.floor(TANK / fuelPerLap));
    const { firstUnlocked, lapsNeeded } = getLockedState();
    let activeCount = 0, lapsAcc = 0;
    for (let i = firstUnlocked; i < MAX_STINTS_LIMIT; i++) {
      lapsAcc += maxLaps + OFFSETS[state.stintTypes[i]]; activeCount++;
      if (lapsAcc >= lapsNeeded) break;
    }
    const current = state.stintTypes.slice(firstUnlocked, firstUnlocked + activeCount);
    for (let i = activeCount - 1; i >= 0; i--) {
      for (const t of Object.keys(OFFSETS)) {
        if (t === current[i]) break;
        const test = [...current]; test[i] = t;
        const total = test.reduce((s, x) => s + maxLaps + OFFSETS[x], 0);
        if (total >= lapsNeeded) return test;
      }
    }
    return null;
  }

  function calc() {
    const { totalLaps, curLap, fuelLeft, estLaps, stintTypes } = state;
    if (!totalLaps || !curLap || !fuelLeft || !estLaps) return;

    const typeClassMap = {
      'Extra Short': 'type-extra-short',
      'Short':       'type-short',
      'Normal':      'type-normal',
      'Long':        'type-long',
      'Extra Long':  'type-extra-long',
    };
    const lightBgTypes = new Set(['Normal', 'Long', 'Extra Long']);

    const fuelPerLap = fuelLeft / estLaps;
    const maxLaps    = Math.max(1, Math.floor(TANK / fuelPerLap));
    const raceRem    = totalLaps - (curLap - 1);
    MAX_STINTS_LIMIT = Math.ceil(raceRem / Math.max(1, maxLaps + OFFSETS['Extra Short'])) + 1;

    const minRowsNeeded = Math.min(MAX_STINTS_LIMIT, Math.ceil(raceRem / maxLaps));
    let dynamicCount = 0, dynamicLaps = 0;
    for (let i = 0; i < MAX_STINTS_LIMIT; i++) {
      const isLocked = state.lockedPitLaps[i] !== null;
      const prevLocked = i === 0 ? 0 : (state.lockedPitLaps[i-1] ?? dynamicLaps);
      const stintLaps = isLocked
        ? state.lockedPitLaps[i] - prevLocked
        : maxLaps + (OFFSETS[state.stintTypes[i]] ?? -2);
      dynamicLaps += stintLaps; dynamicCount++;
      if (dynamicLaps >= totalLaps) break;
    }
    MAX_STINTS = Math.min(MAX_STINTS_LIMIT, Math.max(minRowsNeeded, dynamicCount));

    sv('s-fpl',        fuelPerLap.toFixed(2));
    sv('s-maxlaps',    maxLaps);
    sv('s-lapsrem',    raceRem);
    sv('s-fuelneeded', Math.round(fuelPerLap * raceRem));

    const container = $('stints-body');
    container.innerHTML = '';

    let cumulativeLap = 0, totalFuelUsed = 0, raceComplete = false;
    const stints = [];
    let tempLap = 0;

    for (let i = 0; i < MAX_STINTS; i++) {
      const isLocked = state.lockedPitLaps[i] !== null;
      const stintLaps = isLocked
        ? state.lockedPitLaps[i] - tempLap
        : maxLaps + (OFFSETS[stintTypes[i]] ?? -2);
      const pitLap = tempLap + stintLaps;
      stints.push({ stintLaps, pitLap, isLocked, typeName: stintTypes[i] });
      tempLap = Math.min(pitLap, totalLaps);
      if (pitLap >= totalLaps) break;
    }
    
    const totalCoveredLaps = stints.reduce((s, st) => s + st.stintLaps, 0);

    // Render Timeline Axis
    const axis = $('timeline-axis');
    axis.innerHTML = '<span class="axis-lbl">Laps</span>';
    const axisStep = totalCoveredLaps > 60 ? 10 : 5;
    const maxAxisValue = Math.ceil(totalCoveredLaps / axisStep) * axisStep;
    for (let l = axisStep; l <= maxAxisValue; l += axisStep) {
      const pct = (l / totalCoveredLaps) * 100;
      if (pct <= 100) {
        axis.innerHTML += `<span class="axis-tick" style="left:${pct}%">${l}</span>`;
      }
    }

    // Render Pit Stops Box
    const totalPitStops = Math.max(0, stints.length - 1);
    $('pit-stops-count').textContent = totalPitStops;

    for (let i = 0; i < stints.length; i++) {
      const { stintLaps, pitLap, isLocked, typeName } = stints[i];
      const lapsBefore = cumulativeLap;
      const stintFuel  = fuelPerLap * stintLaps;
      const finishes   = pitLap >= totalLaps;

      totalFuelUsed += stintFuel;
      cumulativeLap  = Math.min(pitLap, totalLaps);

      const pct = (stintLaps / totalCoveredLaps) * 100;

      const isLightBg = lightBgTypes.has(typeName);
      const textClass = isLightBg ? 'seg-text-dark' : 'seg-text-light';
      const typeClass = typeClassMap[typeName] || 'type-normal';

      const seg = document.createElement('div');
      seg.className = `stint-seg ${typeClass} ${textClass}`
        + (isLocked  ? ' locked-seg' : '')
        + (finishes  ? ' finish-seg' : '')
        + (raceComplete ? ' done-seg' : '');
      seg.style.flexBasis = pct + '%';
      seg.style.flexGrow  = pct;

      const fuelCls   = stintFuel > TANK ? 'color:#ff4444' : stintFuel > TANK * 0.92 ? 'color:#ffd700' : '';
      const lockLabel = isLocked ? '🛑 UNLOCK' : '✎ LOCK';
      const lockCls   = isLocked ? 'locked' : '';

      let pitHtml, lapsHtml;
      
      // We swapped the fonts here so PIT gets the large styling
      if (isLocked) {
        lapsHtml = `<input class="pit-input" type="number" data-stint="${i}" data-type="laps" value="${stintLaps}" min="1" max="${maxLaps}" style="font-size:14px; width:28px;">`;
        pitHtml  = `<input class="pit-input" type="number" data-stint="${i}" data-type="pitlap" value="${state.lockedPitLaps[i]}" min="1" max="${totalLaps}" style="font-size:18px; width:38px;">`;
      } else if (finishes) {
        lapsHtml = `<span class="seg-val" style="font-size:14px;">${stintLaps}</span>`;
        pitHtml  = `<span class="seg-main-val" style="font-size:16px; opacity:0.8; letter-spacing:0.5px;">FIN</span>`;
      } else {
        lapsHtml = `<span class="seg-val" style="font-size:14px;">${stintLaps}</span>`;
        pitHtml  = `<span class="seg-main-val" style="font-size:18px;">${pitLap}</span>`;
      }

      /*
      seg.innerHTML = `
        <div class="seg-left">
          <div style="display:flex; flex-direction:column; align-items:flex-start;">
            <div class="seg-lbl">LAPS</div>
            ${lapsHtml}
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-start; margin-left:4px;">
            <div class="seg-lbl">FUEL</div>
            <span class="seg-val" style="font-size:12px; ${fuelCls}">${Math.round(stintFuel)}</span>
          </div>
        </div>

        <div class="seg-right">
          ${pitHtml}
        </div>

        <div class="seg-dropdown">
          <select class="stint-type-sel" style="font-size:8px" data-index="${i}" ${isLocked ? 'disabled' : ''}>
            ${Object.keys(OFFSETS).map(t => `<option value="${t}" ${t===typeName?'selected':''}>${t}</option>`).join('')}
          </select>
          <div class="seg-dropdown-btns">
            <button class="seg-dd-btn ${lockCls}" style="font-size:8px" data-stint="${i}">${lockLabel}</button>
            <button class="seg-dd-btn close-btn" style="font-size:8px">✕ CLOSE</button>
          </div>
        </div>
      `;*/
      seg.innerHTML = `
        <div class="seg-left">
          <div class="seg-lbl">LAPS</div>
          ${lapsHtml}
        </div>

        <div class="seg-center-group">
          <div class="seg-lbl">FUEL</div>
          <span class="seg-val" style="font-size:12px; ${fuelCls}">${Math.round(stintFuel)}</span>
        </div>

        <div class="seg-right">
          ${pitHtml}
        </div>

        <div class="seg-dropdown">
          <select class="stint-type-sel" style="font-size:8px" data-index="${i}" ${isLocked ? 'disabled' : ''}>
            ${Object.keys(OFFSETS).map(t => `<option value="${t}" ${t===typeName?'selected':''}>${t}</option>`).join('')}
          </select>
          <div class="seg-dropdown-btns">
            <button class="seg-dd-btn ${lockCls}" style="font-size:8px" data-stint="${i}">${lockLabel}</button>
            <button class="seg-dd-btn close-btn" style="font-size:8px">✕ CLOSE</button>
          </div>
        </div>
      `;

      container.appendChild(seg);

      seg.addEventListener('click', e => {
        if (e.target.closest('.seg-dropdown') || e.target.classList.contains('pit-input')) return;
        const dd = seg.querySelector('.seg-dropdown');
        const isOpen = dd.classList.contains('open');
        closeAllDropdowns();
        if (!isOpen) dd.classList.add('open');
      });

      seg.querySelector('.close-btn').addEventListener('click', e => {
        e.stopPropagation();
        seg.querySelector('.seg-dropdown').classList.remove('open');
      });

      seg.querySelector('.stint-type-sel').addEventListener('change', e => {
        state.stintTypes[+e.target.dataset.index] = e.target.value;
        closeAllDropdowns();
        calc();
      });

      seg.querySelector('.seg-dd-btn:not(.close-btn)').addEventListener('click', e => {
        e.stopPropagation();
        const idx = +e.target.dataset.stint;
        state.lockedPitLaps[idx] = state.lockedPitLaps[idx] !== null ? null : pitLap;
        closeAllDropdowns();
        autoStrategy();
      });

      /*
      const pitInputEl = seg.querySelector('.pit-input[data-type="pitlap"]');
      if (pitInputEl) {
        pitInputEl.addEventListener('click', e => e.stopPropagation());
        pitInputEl.addEventListener('change', e => {
          const v = parseInt(e.target.value);
          if (!isNaN(v) && v > 0 && v <= totalLaps) {
            state.lockedPitLaps[+e.target.dataset.stint] = v;
            autoStrategy();
          }
        });
      }
      
      const lapsInputEl = seg.querySelector('.pit-input[data-type="laps"]');
      if (lapsInputEl) {
        lapsInputEl.addEventListener('click', e => e.stopPropagation());
        lapsInputEl.addEventListener('change', e => {
          const v = parseInt(e.target.value);
          if (!isNaN(v) && v > 0) {
            state.lockedPitLaps[+e.target.dataset.stint] = lapsBefore + v;
            autoStrategy();
          }
        });
      }*/
     

      if (finishes && !raceComplete) raceComplete = true;
    }

    if (state.totalLaps > 0 && totalCoveredLaps >= state.totalLaps) {
      const finishPct = (state.totalLaps / totalCoveredLaps) * 100;
      const finishLine = document.createElement('div');
      finishLine.className = 'finish-line';
      finishLine.style.left = finishPct + '%';
      container.appendChild(finishLine);
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('.stint-seg')) closeAllDropdowns();
    }, { once: false });

    const totalFuelNeeded = fuelPerLap * totalLaps;
    const finalLeftover   = Math.round(totalFuelUsed - totalFuelNeeded);
    sv('t-left', finalLeftover > 0 ? `+${finalLeftover} fuel left` : `${finalLeftover} fuel short`);

    const warn = $('fuel-warn');
    if (raceComplete) {
      const fewer   = findFewerStopsStrategy();
      const shorter = !fewer ? findShorterStrategy() : null;
      if (fewer || shorter) {
        const suggestion = fewer || shorter;
        const label = fewer ? 'FEWER STOPS ▶' : 'SHORTER STINTS ▶';
        warn.innerHTML = `✓ Pit strategy covers full race distance &nbsp;<button id="fewer-btn" style="background:rgba(255,157,0,0.15);border:1px solid var(--accent);border-radius:3px;color:var(--accent);font-size:9px;font-family:var(--font-ui);font-weight:700;letter-spacing:.5px;cursor:pointer;padding:2px 5px;">${label}</button>`;
        warn.className = 'ok';
        setTimeout(() => {
          const btn = document.getElementById('fewer-btn');
          if (btn) btn.addEventListener('click', () => {
            let firstUnlocked = 0;
            for (let i = 0; i < 5; i++) { if (state.lockedPitLaps[i] !== null) firstUnlocked = i + 1; }
            suggestion.forEach((t, i) => { state.stintTypes[firstUnlocked + i] = t; });
            for (let i = firstUnlocked + suggestion.length; i < 5; i++) state.stintTypes[i] = 'Normal';
            calc();
          });
        }, 0);
      } else {
        warn.textContent = ''; warn.className = ''; warn.style.display = 'none';
      }
    } else {
      warn.textContent = '⚠  Pit strategy does not reach the finish';
      warn.className = 'bad';
    }
  }

  document.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('mousedown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      const input = $(btn.dataset.target);
      const dir   = parseFloat(btn.dataset.dir);
      const min   = parseFloat(input.min) || 0;
      const max   = parseFloat(input.max) || Infinity;
      let val = parseFloat(input.value) || 0;
      val = Math.round((val + dir) * 1000) / 1000;
      val = Math.min(max, Math.max(min, val));
      input.value = parseFloat(val.toFixed(3));
      input.dispatchEvent(new Event('input'));
    });
  });

  document.querySelectorAll('.input-wrap input').forEach((input, idx, all) => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const next = all[idx+1]; if (next) next.focus(); }
    });
  });
  
  document.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('keydown', e => {
      if (e.key === 'Tab' && !e.shiftKey) {
        e.preventDefault();
        const allInputs = [...document.querySelectorAll('.input-wrap input')];
        const idx = allInputs.indexOf(btn.closest('.input-wrap').querySelector('input'));
        const next = allInputs[idx+1]; if (next) next.focus();
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); btn.click(); }
    });
  });

  function updateCurLapMax() {
    const curInput = $('inp-cur');
    curInput.max = state.totalLaps;
    if (state.curLap > state.totalLaps) { state.curLap = state.totalLaps; curInput.value = state.totalLaps; }
  }

  [['inp-laps','totalLaps',true],['inp-cur','curLap',true],['inp-fuel','fuelLeft',false],['inp-estlaps','estLaps',false]]
    .forEach(([id, key, isInt]) => {
      $(id).addEventListener('input', e => {
        const v = isInt ? parseInt(e.target.value) : parseFloat(e.target.value);
        if (!isNaN(v) && v > 0) {
          state[key] = v;
          if (key === 'totalLaps') updateCurLapMax();
          calc();
          const { totalLaps, curLap, fuelLeft, estLaps } = state;
          if (totalLaps && curLap && fuelLeft && estLaps) autoStrategy();
        }
      });
    });

  // Drag
  (function() {
    let dragging = false, ox = 0, oy = 0, posX = 0, posY = 0;
    $('header').addEventListener('mousedown', e => {
      if (e.target.closest('.hbtn')) return;
      dragging = true; ox = e.clientX - posX; oy = e.clientY - posY; e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      posX = e.clientX - ox; posY = e.clientY - oy;
      const scale = parseFloat($('app').dataset.scale || 1);
      $('app').dataset.posX = posX; $('app').dataset.posY = posY;
      $('app').style.transform = `scale(${scale}) translate(${posX/scale}px, ${posY/scale}px)`;
    });
    document.addEventListener('mouseup', () => { dragging = false; });
  })();

  // Resize
  (function() {
    const handle = $('resize-handle'), app = $('app'), BASE_W = 520;
    let resizing = false, startX = 0, startScale = 1;
    handle.addEventListener('mousedown', e => { resizing = true; startX = e.clientX; startScale = parseFloat(app.dataset.scale||1); e.preventDefault(); e.stopPropagation(); });
    document.addEventListener('mousemove', e => {
      if (!resizing) return;
      const newScale = Math.min(4, Math.max(0.4, startScale + (e.clientX - startX) / BASE_W));
      app.dataset.scale = newScale;
      const posX = parseFloat(app.dataset.posX||0), posY = parseFloat(app.dataset.posY||0);
      app.style.transform = `scale(${newScale}) translate(${posX/newScale}px, ${posY/newScale}px)`;
    });
    document.addEventListener('mouseup', () => { resizing = false; });
  })();

  // Toggle inputs
  let inputsCollapsed = false;
  $('inputs-btn').addEventListener('click', () => {
    inputsCollapsed = !inputsCollapsed;
    $('inputs-grid-wrap').style.display = inputsCollapsed ? 'none' : '';
    $('inputs-btn').textContent = inputsCollapsed ? '▸' : '▾';
  });

  calc();

  // PUT THIS AT THE BOTTOM OF YOUR FILE, OUTSIDE OF CALC()
  const container = $('stints-body'); // Make sure you have this reference
  container.addEventListener('change', e => {
    if (e.target.classList.contains('pit-input')) {
      const input = e.target;
      const stintIdx = +input.dataset.stint;
      const type = input.dataset.type;
      const val = parseInt(input.value);

      if (isNaN(val) || val <= 0) return;

      if (type === 'pitlap') {
        state.lockedPitLaps[stintIdx] = val;
      } else if (type === 'laps') {
        // Find previous stint's end lap to calculate absolute lap
        const prevLocked = stintIdx === 0 ? 0 : (state.lockedPitLaps[stintIdx - 1] ?? 0);
        state.lockedPitLaps[stintIdx] = prevLocked + val;
      }
      autoStrategy();
    }
  });

  function toggleStats() {
    const statRow = document.querySelector('.stat-row');
    const btn = event.target;
    
    // Toggle the display
    if (statRow.style.display === 'none') {
      statRow.style.display = 'grid'; // Reverts to your original display type
      btn.textContent = '▼';           // Arrow pointing down
    } else {
      statRow.style.display = 'none';
      btn.textContent = '▲';           // Arrow pointing up
    }
  }
</script>
</body>
</html>
